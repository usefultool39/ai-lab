<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>AI 实验室 · 项目进度</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #1a202c;
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        .title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #718096;
            font-size: 0.95rem;
        }
        .stats-row {
            display: flex;
            gap: 1.5rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .stat-card {
            background: linear-gradient(135deg, #f6f8ff 0%, #ffffff 100%);
            padding: 1.25rem 1.5rem;
            border-radius: 16px;
            min-width: 140px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #718096;
            font-weight: 500;
        }
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        .category-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 1.75rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        .category-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2d3748;
        }
        .card-count {
            font-size: 0.9rem;
            color: #a0aec0;
            font-weight: 500;
        }
        .progress-wrapper {
            margin-bottom: 1rem;
        }
        .progress-bg {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #48bb78, #38a169);
            border-radius: 4px;
            transition: width 0.8s ease-out;
        }
        .progress-text {
            font-size: 0.8rem;
            color: #718096;
            margin-top: 0.5rem;
            text-align: right;
        }
        .task-dots {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.75rem;
        }
        .dot {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .dot.completed {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
        }
        .dot.pending {
            background: #e2e8f0;
            color: #a0aec0;
        }
        .dot:hover {
            transform: scale(1.2);
        }
        /* 加载动画 */
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 4rem auto;

        }
    </style>
</head>
<body>
    <div class="glass-header">
        <div class="header-inner">
            <h1 class="title">🧪 AI + Robotics 经典方法复现计划</h1>
            <p class="subtitle">从 1950s 到 2026，系统复现 132 项经典算法</p>
            <div class="stats-row" id="stats">
                <div class="loader"></div>
            </div>
        </div>
    </div>
    <div class="main-container">
        <div class="grid" id="grid">
            <div class="loader"></div>
        </div>
    </div>

    <script>
        const EMBEDDED_DATA = window.__EMBEDDED__;
        (EMBEDDED_DATA ? Promise.resolve(EMBEDDED_DATA) : fetch('data.json').then(r => r.json()))
            .then(data => {
                const stats = document.getElementById('stats');
                stats.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${data.stats.total}</div>
                        <div class="stat-label">总任务数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.stats.completed}</div>
                        <div class="stat-label">已完成</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.stats.progress}%</div>
                        <div class="stat-label">总进度</div>
                    </div>
                `;

                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                
                data.categories.forEach((cat, idx) => {
                    const completed = cat.tasks.filter(t => t.status === '完成').length;
                    const progress = cat.expected_count ? Math.round(completed / cat.expected_count * 100) : 0;
                    
                    const dots = cat.tasks.slice(0, 10).map(t => 
                        `<span class="dot ${t.status === '完成' ? 'completed' : 'pending'}">${t.id.slice(1)}</span>`
                    ).join('');
                    
                    if (cat.tasks.length > 10) {
                        dots += `<span class="dot pending">+${cat.tasks.length - 10}</span>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'category-card';
                    card.style.animationDelay = `${idx * 50}ms`;
                    card.onclick = () => window.location.href = `category.html?id=${cat.id}`;
                    
                    card.innerHTML = `
                        <div class="card-top">
                            <span class="card-title">${cat.name}</span>
                            <span class="card-count">${completed} / ${cat.expected_count}</span>
                        </div>
                        <div class="progress-wrapper">
                            <div class="progress-bg"><div class="progress-fill" style="width:${progress}%"></div></div>
                            <div class="progress-text">${progress}% 完成</div>
                        </div>
                        <div class="task-dots">${dots}</div>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(e => {
                console.error(e);
                document.getElementById('grid').innerHTML = '<p style="text-align:center;color:white;padding:2rem">数据加载失败，请先运行 generate.py</p>';
            });
    </script>
</body>
</html>
